[workspace]
members = ["xtask", "crates/forge-domain", "crates/forge-policy", "crates/forge-crypto", "crates/forge-adapters", "crates/forge-storage", "crates/forge-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Optimise crypto deps in test builds so PBKDF2-200k doesn't time out.
[profile.test.package."*"]
opt-level = 2
