[package]
name = "forge-xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
forge-domain = { path = "../crates/forge-domain" }
forge-policy = { path = "../crates/forge-policy" }
forge-crypto = { path = "../crates/forge-crypto" }
forge-adapters = { path = "../crates/forge-adapters" }
forge-storage = { path = "../crates/forge-storage" }
# T10: bus_verify needs direct access to forge-runtime types
forge-runtime = { path = "../crates/forge-runtime" }
rusqlite = { version = "0.32", features = ["bundled"] }
# T9: postgres_verify needs direct access to sqlx queries and tokio runtime
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
pulldown-cmark = "0.13"

[lints]
workspace = true
