[package]
name = "forge-xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
forge-domain = { path = "../crates/forge-domain" }
forge-policy = { path = "../crates/forge-policy" }
forge-crypto = { path = "../crates/forge-crypto" }
forge-adapters = { path = "../crates/forge-adapters" }
forge-storage = { path = "../crates/forge-storage" }
# T10: bus_verify needs direct access to forge-runtime types
forge-runtime = { path = "../crates/forge-runtime" }
# T13: discovery_verify needs forge-discovery types
forge-discovery = { path = "../crates/forge-discovery" }
# T19: graphs_verify needs forge-reporting types
forge-reporting = { path = "../crates/forge-reporting" }
# T21: monitoring_verify needs forge-operations types
forge-operations = { path = "../crates/forge-operations" }
# T25: cli_verify needs forge-cli types
forge-cli = { path = "../crates/forge-cli" }
# T26: platform_verify needs forge-server types
forge-server = { path = "../crates/forge-server" }
# T28–30: ui_verify needs forge-ui types
forge-ui = { path = "../crates/forge-ui" }
# T31–36: release_verify needs forge-release types
forge-release = { path = "../crates/forge-release" }
rusqlite = { version = "0.32", features = ["bundled"] }
# T9: postgres_verify needs direct access to sqlx queries and tokio runtime
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
pulldown-cmark = "0.13"

[lints]
workspace = true
