[package]
name = "forge-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T11: ExternalPluginRunner needs async process + timeout
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros"] }
async-trait = "0.1"

[lints]
workspace = true
