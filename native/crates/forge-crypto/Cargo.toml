[package]
name = "forge-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[lints]
workspace = true
