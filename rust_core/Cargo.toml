[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"
authors = ["FORGE Toolkit"]
description = "Core offensive security modules - Rust implementation"

[lib]
name = "forge_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cryptography
aes-gcm = "0.10"
base64 = "0.22"
blake3 = "1.5"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }

# Cross-platform FFI
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }

# LDAP for Kerberoast enumeration (anonymous bind, SPN search)
ldap3 = "0.11"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }

[target.'cfg(windows)'.dependencies]
# Windows API for LSASS dump and Pass-the-Hash execution
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.forge-core]
overflow-checks = false

[features]
default = []
obfuscated = []
stealth = []
