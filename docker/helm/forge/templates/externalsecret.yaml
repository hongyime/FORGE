{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "forge.fullname" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "forge.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: web-secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.webSecretKey.key }}
    - secretKey: web-bootstrap-token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.webBootstrapToken.key }}
    - secretKey: engagement-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.engagementKey.key }}
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.postgresPassword.key }}
    - secretKey: audit-bundle-remote-scope
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.auditBundleRemoteScope.key }}
{{- end }}
