{{- if and (not .Values.secrets.existingSecretName) (not .Values.externalSecrets.enabled) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge.secretName" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  web-secret-key: {{ required "secrets.webSecretKey is required" .Values.secrets.webSecretKey | quote }}
  web-bootstrap-token: {{ required "secrets.webBootstrapToken is required" .Values.secrets.webBootstrapToken | quote }}
  engagement-key: {{ required "secrets.engagementKey is required" .Values.secrets.engagementKey | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  audit-bundle-remote-scope: {{ required "secrets.auditBundleRemoteScope is required" .Values.secrets.auditBundleRemoteScope | quote }}
{{- end }}
