name: detection-surface

# E3.3 - measure how detectable FORGE binaries look to AV/EDR.
# Runs monthly on schedule and manually via workflow_dispatch.
# Warns on high AV detection but never fails CI.

on:
  schedule:
    # Monthly on the 3rd at 04:00 UTC (12:00 SGT) - staggered vs scorecard.
    - cron: "0 4 3 * *"
  workflow_dispatch:
    inputs:
      binary_path:
        description: "Relative path to the binary/artifact to measure"
        required: false
        default: "forge_core.so"

permissions:
  contents: read

jobs:
  measure:
    name: Measure detection surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ClamAV (local scanner)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_core/target
          key: ${{ runner.os }}-cargo-detection-surface-${{ hashFiles('rust_core/Cargo.toml', 'rust_core/Cargo.lock') }}

      - name: Build Rust extension (forge_core)
        run: |
          set -euo pipefail
          cargo build --release --manifest-path rust_core/Cargo.toml
          # Normalize the platform artifact name for downstream scanning.
          # ubuntu-latest produces libforge_core.so; copy to forge_core.so at repo root.
          src="rust_core/target/release/libforge_core.so"
          if [ ! -f "${src}" ]; then
            echo "::error::Rust build did not produce ${src}"
            exit 1
          fi
          cp "${src}" "forge_core.so"
          ls -la forge_core.so

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          # Prefer explicit workflow_dispatch input, then platform-native artifact.
          # SECURITY: never fall back to bootstrap.py — that scans Python source
          # (including any embedded env values) as though it were the shipped binary,
          # which leaks credentials and produces meaningless AV signal.
          candidate="${{ github.event.inputs.binary_path }}"
          if [ -z "${candidate}" ] || [ ! -f "${candidate}" ]; then
            if [ -f "forge_core.so" ]; then
              candidate="forge_core.so"
            elif [ -f "forge_core.pyd" ]; then
              candidate="forge_core.pyd"
            else
              echo "::error::Compiled forge_core extension not found; refusing to scan Python source."
              exit 1
            fi
          fi
          case "${candidate}" in
            *bootstrap.py|*/bootstrap.py)
              echo "::error::Refusing to scan bootstrap.py — Python source may embed credentials."
              exit 1
              ;;
          esac
          echo "path=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Run measurement
        env:
          BINARY_PATH: ${{ steps.locate.outputs.path }}
          FORGE_VT_API_KEY: ${{ secrets.FORGE_VT_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from forge.security.detection_surface import run_full_measurement

          binary = Path(os.environ.get("BINARY_PATH", "${{ steps.locate.outputs.path }}"))
          history = Path("reports/security/detection_surface_history.jsonl")
          report = run_full_measurement(binary, history_path=history, av_target=5)

          out = Path("reports/security/detection_surface_latest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, sort_keys=True))
          print(json.dumps({
              "binary": report["binary"],
              "sha256": report["sha256"],
              "av_source": report["av"]["source"],
              "av_detected": report["av"]["detected_count"],
              "av_total": report["av"]["total_engines"],
              "target_max_av_detections": report["target_max_av_detections"],
              "target_met": report["target_met"],
              "entropy": report["entropy"]["entropy_score"],
              "entropy_suspicious": report["entropy"]["is_suspicious"],
              "suspicious_string_count": len(report["strings"]["suspicious_strings"]),
              "matched_patterns": report["strings"]["matched_patterns"],
          }, indent=2))

          if not report["target_met"]:
              print(f"::warning::AV detections ({report['av']['detected_count']}) exceed target ({report['target_max_av_detections']}); posture regression")
          if report["entropy"]["is_suspicious"]:
              print(f"::warning::High entropy ({report['entropy']['entropy_score']}); binary looks packed/obfuscated")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-surface-${{ github.run_number }}
          path: reports/security/
          # Sensitive: reports contain SHA-256 hashes of suspicious strings and
          # AV signature hits. Keep short so CI artifact storage cannot become
          # a long-lived leak surface.
          retention-days: 30
          if-no-files-found: warn
