---
# .github/workflows/forge-ci.yml
# FORGE Toolkit v7.2 — Full CI Pipeline
#
# Pipeline stages (in dependency order):
#   lint              → ruff + mypy strict + bandit SAST
#   test-opsec        → evasion assertion tests (pattern-negative)
#   test-core         → Phase 0 KB + Phase 1 recon unit tests
#   test-phase2-core  → OSINT modules (VCR replay; no live network)
#   test-phase2-extended → credential validation (Docker SSH/SMB)
#   test-phase3       → evasion & payload generation
#   test-phase4-correlation → exploit correlation (Modules 4-A through 4-C)
#   test-phase4-cloud → cloud vulnerability discovery (Modules 4-D through 4-G)
#   test-phase5       → post-exploitation unit + integration tests
#   test-phase6       → LLM reporting (validator 100%; synthesizer mocked)
#   test-integration  → full kill-chain integration smoke test
#   build             → PyInstaller single-file binary (main branch only)
#
# Key invariants:
#   - All external API calls replaced by VCR cassette replay (--record-mode=none).
#   - No live network access permitted in any test job except test-phase2-extended
#     which uses Docker-internal services only.
#   - CI installs from pyproject.toml optional dependency groups.
#   - build job runs only on refs/heads/main after all test jobs pass.
#   - FORGE_OFFLINE_STRICT=1 is set for all test jobs to enforce offline mode.

name: FORGE CI v7.2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  FORGE_OFFLINE_STRICT: "1"

# ── Lint ───────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.9.4 mypy==1.14.1 bandit==1.8.3

      - name: Ruff — lint
        run: ruff check forge/ tests/ --output-format=github

      - name: Ruff — format check
        run: ruff format forge/ tests/ --check

      - name: mypy — strict type check (advisory)
        continue-on-error: true
        run: |
          mypy forge/ \
            --strict \
            --ignore-missing-imports \
            --python-version 3.11 \
            --no-error-summary

      - name: Bandit — SAST (medium+ severity)
        run: bandit -r forge/ -ll -ii --format json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sast-report
          path: bandit-report.json

# ── Evasion assertions ─────────────────────────────────────────────────────────
  test-opsec:
    name: OPSEC — Evasion Assertions
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run evasion assertion tests
        run: |
          pytest tests/opsec/test_evasion_assertions.py \
            -v --tb=short \
            --cov=forge/utils/post \
            --cov-report=term-missing
        env:
          FORGE_OFFLINE_STRICT: "1"

# ── Phase 0 + Phase 1 core ────────────────────────────────────────────────────
  test-core:
    name: Core — Phase 0 KB + Phase 1 Recon
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run core tests
        run: |
          pytest tests/phase0/ tests/phase1/ \
            --record-mode=none \
            --cov=forge/phase0 \
            --cov=forge/phase1 \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v --tb=short

# ── Phase 2 OSINT (VCR replay) ────────────────────────────────────────────────
  test-phase2-core:
    name: Phase 2 — OSINT Core (VCR)
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run Phase 2 core tests
        run: |
          pytest tests/phase2/test_breach_db.py \
                 tests/phase2/test_dehashed.py \
                 tests/phase2/test_xposedornot.py \
                 tests/phase2/test_theharvester.py \
                 tests/phase2/test_paste_monitor.py \
                 tests/phase2/test_scavenger.py \
                 tests/phase2/test_secret_finder.py \
                 tests/phase2/test_scavenger_scope_gate.py \
            --record-mode=none \
            --cov=forge/utils/intel \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v --tb=short
      # Zero-network-call assertion for --no-validate mode
      - name: Assert --no-validate makes zero network calls
        run: |
          pytest tests/phase2/test_secret_finder.py::test_no_validate_zero_network_calls -v

# ── Phase 2 credential validation (Docker) ────────────────────────────────────
  test-phase2-extended:
    name: Phase 2 — Credential Validation (Docker SSH/SMB)
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    services:
      mock-ssh:
        image: linuxserver/openssh-server:9.3_p2-r1-ls145
        ports:
          - "2222:2222"
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: testuser
          USER_PASSWORD: testpass
      mock-smb:
        image: dperson/samba:latest
        ports:
          - "4445:445"
        options: >-
          -u "testuser;testpass"
          -s "test;/tmp"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run credential validation tests
        run: |
          pytest tests/integration/test_credential_validator.py \
            --cov=forge/utils/intel \
            --cov-fail-under=70 \
            -v --tb=short
        env:
          MOCK_SSH_HOST: localhost
          MOCK_SSH_PORT: "2222"
          MOCK_SMB_HOST: localhost
          MOCK_SMB_PORT: "4445"
          FORGE_OFFLINE_STRICT: "0"   # credential validation requires outbound to mock services

# ── Phase 3 Evasion & Payload ─────────────────────────────────────────────────
  test-phase3:
    name: Phase 3 — Evasion & Payload Generation
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run Phase 3 tests
        run: |
          pytest tests/phase3/ \
            --cov=forge/phase3 \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v --tb=short
      # Scope gate assertion
      - name: Assert OPSEC invariants
        run: pytest tests/phase3/test_opsec_gates.py -v

# ── Phase 4 exploit correlation ───────────────────────────────────────────────
  test-phase4-correlation:
    name: Phase 4 — Exploit Correlation (Modules 4-A through 4-C)
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run correlation tests
        run: |
          pytest tests/phase4/test_correlator.py \
                 tests/phase4/test_hash_taxonomy.py \
                 tests/phase4/test_hash_credential_bridge.py \
                 tests/phase4/test_hash_correlation_integration.py \
            --record-mode=none \
            --cov=forge/phase4 \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v --tb=short
      # Evidence truncation invariant
      - name: Assert evidence ≤ 512 chars
        run: pytest tests/phase4/test_evidence_truncation.py -v

# ── Phase 4 cloud vulnerability discovery ─────────────────────────────────────
  test-phase4-cloud:
    name: Phase 4 — Cloud Vulnerability Discovery (Modules 4-D through 4-G)
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    container:
      image: ghcr.io/redhuntlabs/agneyastra:1.0.0   # provides agneyastra binary for 4-E tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run cloud module tests
        run: |
          pytest tests/phase4/test_param_probe.py \
                 tests/phase4/test_cloud_audit.py \
                 tests/phase4/test_mobile_config_parse.py \
                 tests/phase4/test_api_policy_check.py \
            --record-mode=none \
            --cov=forge/phase4 \
            --cov-fail-under=75 \
            -v --tb=short
      # Scope gate: all cloud modules must raise ScopeViolationError on out-of-scope URLs
      - name: Assert scope gate on cloud modules
        run: pytest tests/phase4/test_scope_gate_phase4.py -v
      # Agneyastra output file must be deleted after parse
      - name: Assert Agneyastra temp file cleanup
        run: pytest tests/phase4/test_cloud_audit.py::test_agneyastra_output_deleted -v

# ── Phase 5 post-exploitation ─────────────────────────────────────────────────
  test-phase5:
    name: Phase 5 — Post-Exploitation
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    services:
      mock-ssh:
        image: linuxserver/openssh-server:9.3_p2-r1-ls145
        ports:
          - "2223:2222"
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: testuser
          USER_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run Phase 5 unit tests
        run: |
          pytest tests/phase5/ \
            --cov=forge/utils/post \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v --tb=short
      - name: Run Phase 5 integration tests
        run: |
          pytest tests/integration/test_lateral_movement.py \
                 tests/integration/test_exfiltration.py \
            --cov=forge/utils/post \
            --cov-fail-under=70 \
            -v --tb=short
        env:
          MOCK_SSH_HOST: localhost
          MOCK_SSH_PORT: "2223"
          FORGE_OFFLINE_STRICT: "0"   # SSH integration requires connectivity to Docker service
      # Evasion assertions specific to Phase 5 artifacts
      - name: Assert Phase 5 evasion signatures absent
        run: pytest tests/phase5/ -k "banned or evasion" -v

# ── Phase 6 LLM reporting ─────────────────────────────────────────────────────
  test-phase6:
    name: Phase 6 — LLM-Assisted Reporting
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run Phase 6 tests
        run: |
          pytest tests/phase6/ \
            --cov=forge/phase6 \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v --tb=short
      # Validator must achieve 100% coverage (it is the primary delivery gate)
      - name: Assert validator 100% coverage
        run: |
          pytest tests/phase6/ \
            --cov=forge/phase6/llm_validator \
            --cov-fail-under=100 \
            -q

# ── OPSEC invariants (cross-phase) ────────────────────────────────────────────
  test-opsec-invariants:
    name: OPSEC — Cross-Phase Invariants
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: [test-core, test-phase2-core, test-phase3, test-phase4-correlation, test-phase5, test-phase6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run OPSEC invariant tests
        # Assertions enforced:
        #   - No plaintext passwords in audit_log
        #   - scope_gate raises ScopeViolationError on out-of-scope targets
        #   - All Phase 5 output agents contain REPLACE_BEFORE_DEPLOY sentinel
        #   - Beacon intervals use Gaussian distribution (K-S test vs uniform)
        #   - No raw API key values (32+ char hex/base64) in audit_log
        #   - Agneyastra output file deleted post-parse
        #   - vulnerability_findings.evidence length ≤ 512 chars
        run: pytest tests/opsec/ -v --tb=short

# ── Kill-chain integration smoke test ─────────────────────────────────────────
  test-integration:
    name: Kill-Chain Integration Smoke Test
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs:
      - test-core
      - test-phase2-core
      - test-phase3
      - test-phase4-correlation
      - test-phase5
      - test-phase6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,artifacts,offensive,graph]"
      - name: Run kill-chain smoke test
        run: pytest tests/integration/test_kill_chain.py -v --tb=short

# ── PyInstaller build ─────────────────────────────────────────────────────────
  build:
    name: PyInstaller — Linux x86_64
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs:
      - test-core
      - test-opsec
      - test-opsec-invariants
      - test-phase2-core
      - test-phase2-extended
      - test-phase3
      - test-phase4-correlation
      - test-phase5
      - test-phase6
      - test-integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime + build deps
        run: |
          pip install -e ".[artifacts,offensive,graph]"
          pip install pyinstaller==6.21.0

      - name: Build single-file binary
        run: |
          pyinstaller \
            --onefile \
            --name forge \
            --add-data "forge/phase6/templates:forge/phase6/templates" \
            --add-data "data/kb.db:data" \
            --hidden-import curl_cffi \
            --hidden-import curl_cffi.requests \
            --hidden-import pydantic \
            --hidden-import pydantic.v1 \
            --hidden-import llama_cpp \
            --hidden-import impacket \
            --hidden-import impacket.smbconnection \
            --hidden-import jinja2 \
            --hidden-import questionary \
            --hidden-import rich \
            --hidden-import asyncssh \
            --hidden-import pywinrm \
            forge/cli.py

      - name: Smoke-test binary
        run: ./dist/forge --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: forge-linux-x86_64
          path: dist/forge
          retention-days: 30
